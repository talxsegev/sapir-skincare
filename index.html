  <body>
    <!--
      Static form for Netlify's build-time form-detection bot. This is never
      shown or used directly -- the real, interactive form is rendered by
      React at src/components_test/ConsultationPageComponents/ConsultationSurvey.tsx
      and submits via fetch() to this same registered form name ("consultation").
      Netlify's crawler only scans the built HTML (it doesn't run JS), so a
      form that only ever exists inside a React component would never be
      registered without this static twin. If a field is added to
      surveyData.ts, add its name here too so Netlify's dashboard shows it.
    -->
    <form name="consultation" data-netlify="true" data-netlify-honeypot="bot-field" hidden>

      <input type="text" name="Age" />
